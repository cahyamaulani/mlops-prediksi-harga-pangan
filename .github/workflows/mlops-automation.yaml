name: MLOps Automation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # schedule:
    # - cron: "0 22 * * *"  # Setiap hari jam 05.00 WIB

env:
  MLFLOW_TRACKING_URI: https://dagshub.com/cahyamaulani/mlops-prediksi-harga-pangan.mlflow
  MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
  DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
  DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

jobs:
  # ============================================================
  # JOB 0: DAILY INGEST (hanya saat scheduled, bukan saat push)
  # ============================================================
  daily-ingest:
    name: "Stage 0 - Daily Data Ingestion"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4
        with:
          # FIX: pakai PAT (Personal Access Token) bukan GITHUB_TOKEN
          # GITHUB_TOKEN default hanya read-only → 403 saat push
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup DVC remote
        run: |
          dvc remote modify dagshub --local auth basic
          dvc remote modify dagshub --local user $DAGSHUB_USERNAME
          dvc remote modify dagshub --local password $DAGSHUB_TOKEN

      - name: Pull data existing dari DagsHub
        run: dvc pull --remote dagshub --force

      - name: Ingest data terbaru dari BI PIHPS
        run: python src/data/ingest_data.py incremental

      - name: Preprocessing
        run: python src/data/preprocess.py

      - name: Feature Engineering
        run: python src/features/feature_engineering.py

      - name: Drift Detection
        run: python src/monitoring/drift_detection.py

      - name: Cek apakah perlu retraining
        id: cek_drift
        run: |
          python -c "
          import json, os
          path = 'data/processed/drift_report.json'
          if not os.path.exists(path):
              print('RETRAIN=false')
          else:
              with open(path) as f:
                  r = json.load(f)
              ada_drift = any(v['psi'] >= 0.2 for v in r.get('results', {}).values())
              print('RETRAIN=true' if ada_drift else 'RETRAIN=false')
          " >> $GITHUB_ENV

      - name: Retrain jika ada drift (PSI >= 0.2)
        if: env.RETRAIN == 'true'
        run: |
          echo "⚠️ Drift terdeteksi! Menjalankan retraining..."
          python src/models/train.py
          python scripts/evaluate_and_validate.py
          python src/registry/register_model.py
          echo "✅ Retraining selesai dan model diregister"

      - name: DVC push data baru ke DagsHub
        run: dvc push --remote dagshub

      - name: Commit updated DVC pointer ke GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/harga_pangan.csv.dvc
          # FIX: pakai -f untuk force-add file yang ada di .gitignore
          git add -f data/processed/drift_report.json || true
          git diff --staged --quiet || git commit -m "data: auto-ingest harian $(date +%Y-%m-%d) [skip ci]"
          git push

  # ============================================================
  # JOB 1: AUTOMATED TESTING (saat push/PR)
  # ============================================================
  test:
    name: "Stage 1 - Automated Testing"
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  # ============================================================
  # JOB 2: AUTOMATED TRAINING
  # ============================================================
  train:
    name: "Stage 2 - Automated Training"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data dari DVC
        run: |
          dvc remote modify dagshub --local auth basic
          dvc remote modify dagshub --local user $DAGSHUB_USERNAME
          dvc remote modify dagshub --local password $DAGSHUB_TOKEN
          dvc pull --remote dagshub --force

      - name: Run preprocessing
        run: python src/data/preprocess.py

      - name: Run feature engineering
        run: python src/features/feature_engineering.py

      - name: Run training
        run: python src/models/train.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-results
          path: models/

  # ============================================================
  # JOB 3: MODEL EVALUATION & VALIDATION
  # ============================================================
  evaluate:
    name: "Stage 3 - Model Evaluation & Validation"
    runs-on: ubuntu-latest
    needs: train
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-results
          path: models/

      - name: Run evaluation & validation
        run: python scripts/evaluate_and_validate.py

  # ============================================================
  # JOB 4: AUTO REGISTRY UPDATE
  # ============================================================
  register:
    name: "Stage 4 - Auto Registry Update"
    runs-on: ubuntu-latest
    needs: evaluate
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-results
          path: models/

      - name: Pull data dari DVC
        run: |
          dvc remote modify dagshub --local auth basic
          dvc remote modify dagshub --local user $DAGSHUB_USERNAME
          dvc remote modify dagshub --local password $DAGSHUB_TOKEN
          dvc pull --remote dagshub --force

      - name: Run preprocessing & feature engineering
        run: |
          python src/data/preprocess.py
          python src/features/feature_engineering.py

      - name: Register model ke MLflow
        run: python src/registry/register_model.py