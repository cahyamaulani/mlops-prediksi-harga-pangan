name: Continuous Training Pipeline

on:
  schedule:
    - cron: "0 17 * * 0"  # Setiap Minggu jam 00:00 WIB

  workflow_dispatch:
    inputs:
      reason:
        description: "Alasan retraining manual"
        required: false
        default: "Manual trigger"

env:
  MLFLOW_TRACKING_URI: https://dagshub.com/cahyamaulani/mlops-prediksi-harga-pangan.mlflow
  MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
  DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
  DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

jobs:
  # ============================================================
  # JOB 1: CEK TRIGGER
  # ============================================================
  check-triggers:
    name: "Check CT Triggers"
    runs-on: ubuntu-latest

    outputs:
      should_retrain: ${{ steps.check.outputs.should_retrain }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data dari DVC
        run: |
          dvc remote modify dagshub --local auth basic
          dvc remote modify dagshub --local user $DAGSHUB_USERNAME
          dvc remote modify dagshub --local password $DAGSHUB_TOKEN
          dvc pull --remote dagshub --force

      - name: Run preprocessing untuk drift detection
        run: |
          python src/data/preprocess.py
          python src/monitoring/drift_detection.py

      - name: Check triggers
        id: check
        # FIX: pakai continue-on-error karena exit code 1 = "perlu retrain" (bukan error)
        # Output should_retrain ditulis ke GITHUB_OUTPUT di dalam script Python
        run: python scripts/check_triggers.py
        continue-on-error: true

      # FIX: kalau script tidak nulis output (misal file tidak ada), default false
      - name: Set default output jika belum di-set
        run: |
          if [ -z "${{ steps.check.outputs.should_retrain }}" ]; then
            echo "should_retrain=false" >> $GITHUB_OUTPUT
          fi

  # ============================================================
  # JOB 2: RETRAINING (hanya kalau trigger aktif)
  # ============================================================
  retrain:
    name: "Continuous Training"
    runs-on: ubuntu-latest
    needs: check-triggers
    # FIX: bandingkan dengan 'true' (string), bukan '1'
    if: needs.check-triggers.outputs.should_retrain == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data terbaru dari DVC
        run: |
          dvc remote modify dagshub --local auth basic
          dvc remote modify dagshub --local user $DAGSHUB_USERNAME
          dvc remote modify dagshub --local password $DAGSHUB_TOKEN
          dvc pull --remote dagshub --force

      - name: Preprocessing & Feature Engineering
        run: |
          python src/data/preprocess.py
          python src/features/feature_engineering.py

      - name: Retraining model
        run: python src/models/train.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retrained-models
          path: models/

  # ============================================================
  # JOB 3: EVALUASI & PROMOTE
  # ============================================================
  evaluate-and-promote:
    name: "Evaluate & Promote"
    runs-on: ubuntu-latest
    needs: retrain

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: retrained-models
          path: models/

      - name: Compare & Promote model
        run: python scripts/compare_models.py